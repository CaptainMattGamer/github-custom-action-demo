name: 'Deploy to AWS S3'
description: 'Deploy a static website via AWS S3'
inputs:
  bucket:
    description: 'The S3 Bucket Name'
    required: true
  bucket-region:
    description: 'The Region of the Bucket'
    required: false
    default: 'eu-west-2'
  dist-folder:
    description: 'Folder with deployable files'
    required: true
runs:
  using: 'node24'
  main: 'main.js'